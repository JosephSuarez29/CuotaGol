name: Actualizar datos

on:
  schedule:
    # Horas en UTC. Peru es UTC-5: 11:00 UTC = 6:00 a. m. y 23:00 UTC = 6:00 p. m.
    - cron: "0 11 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar stats.json y partidos.json
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python actualizar_datos.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json partidos.json tablas.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar datos"
            git push
          fi
